packages:
  - packages/*
  - examples/*
  - packages/layerscope/test/fixtures/*
  # Installed from a directory, so pnpm copies it like a package from npm.
  - '!packages/layerscope/test/fixtures/npm-layer'
  # Only reached through a local git repo.
  - '!packages/layerscope/test/fixtures/remote-layer'

# The example asks for the published range of nuxt-layerscope, so a copy of it installs from npm.
# In this repository, pnpm links the workspace package when the range matches its version.
linkWorkspacePackages: true

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1
  vite-plus: 1.5.1
  vitest: 5.1.0
  '@vitest/coverage-v8': 5.1.0

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

minimumReleaseAgeExclude:
  - '@commitlint/cli@21.2.4'
  - '@commitlint/config-conventional@21.2.4'
  - '@commitlint/ensure@21.2.4'
  - '@commitlint/lint@21.2.4'
  - '@commitlint/load@21.2.4'
  - '@commitlint/rules@21.2.4'
  - '@voidzero-dev/vite-plus-core@1.5.1'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.5.1'
  - '@voidzero-dev/vite-plus-darwin-x64@1.5.1'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.5.1'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.5.1'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.5.1'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.5.1'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.5.1'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.5.1'
  - vite-plus@1.5.1

allowBuilds:
  esbuild: true
