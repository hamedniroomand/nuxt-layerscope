packages:
  - packages/*
  - examples/*
  - packages/layerscope/test/fixtures/*
  # Installed from a directory, so pnpm copies it like a package from npm.
  - '!packages/layerscope/test/fixtures/npm-layer'
  # Only reached through a local git repo.
  - '!packages/layerscope/test/fixtures/remote-layer'

# The example asks for the published range of nuxt-layerscope, so a copy of it installs from npm.
# In this repository, pnpm links the workspace package when the range matches its version.
linkWorkspacePackages: true

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  '@vitest/coverage-v8': 5.0.5

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

minimumReleaseAgeExclude:
  - '@commitlint/cli@21.2.4'
  - '@commitlint/config-conventional@21.2.4'
  - '@commitlint/ensure@21.2.4'
  - '@commitlint/lint@21.2.4'
  - '@commitlint/load@21.2.4'
  - '@commitlint/rules@21.2.4'

allowBuilds:
  esbuild: true
