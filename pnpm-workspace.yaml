packages:
  - packages/*
  - examples/*
  - packages/layerscope/test/fixtures/*
  # Installed from a directory, so pnpm copies it like a package from npm.
  - '!packages/layerscope/test/fixtures/npm-layer'
  # Only reached through a local git repo.
  - '!packages/layerscope/test/fixtures/remote-layer'

# The example asks for the published range of nuxt-layerscope, so a copy of it installs from npm.
# In this repository, pnpm links the workspace package when the range matches its version.
linkWorkspacePackages: true

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  vitest: 5.0.3
  '@vitest/coverage-v8': 5.0.3

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core@1.0.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.0.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.0.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.0.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0'
  - vite-plus@1.0.0
  - playwright-core@1.64.0

allowBuilds:
  esbuild: true
