name: Release

# Publishes nuxt-layerscope to npm when a `v<major>.<minor>.<patch>` tag is pushed (a pre-release
# suffix such as `-beta.1` is allowed). The moving major tag that this workflow makes at the end
# (`v0`) does not match the pattern, so it does not start a release. It uses npm trusted publishing
# (OIDC), so no npm token is stored in the repository, and npm adds provenance on its own once
# the repository is public. npm only accepts it after the package exists and this workflow is
# registered as its trusted publisher: publish the first version by hand, see
# packages/docs/contributing/releasing.md.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment set on the npm trusted publisher; add protection rules here.
    environment: npm
    permissions:
      # Creates the GitHub release.
      contents: write
      # Proves to npm that this workflow is the trusted publisher.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true
          run-install: true
      - name: Check the tag matches the package version
        working-directory: packages/layerscope
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - run: vp run ready
      # pnpm pack replaces `catalog:` specifiers; npm pack would publish them as they are.
      - name: Pack
        working-directory: packages/layerscope
        run: vp pm pack --pack-destination "$RUNNER_TEMP/package"
      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install --global npm@^11.5.1
      - name: Publish
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          npm publish "$RUNNER_TEMP"/package/nuxt-layerscope-*.tgz --access public --tag "$tag"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The changelog section of this version, without its heading.
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' packages/layerscope/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
      # Moves the major tag (`v0`) to the released commit, so `nuxt-layerscope@v0` in a workflow
      # follows the newest release. A pre-release does not move it.
      - name: Move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) exit 0 ;; esac
          major="${GITHUB_REF_NAME%%.*}"
          sha="$(git rev-parse HEAD)"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" \
              -f sha="$sha" -F force=true
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$major" -f sha="$sha"
          fi
