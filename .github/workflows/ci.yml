name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true
          run-install: true
      - run: vp run ready
      - name: Check the package (publint, are-the-types-wrong)
        working-directory: packages/layerscope
        run: |
          npx --yes publint --pack npm --strict .
          npx --yes @arethetypeswrong/cli --pack . --profile esm-only

  nuxt-versions:
    name: Fixture matrix (Nuxt ${{ matrix.nuxt }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Latest 3.x, 4.0 and latest 4.x. Every fixture must match its expected-findings snapshot.
        nuxt: ['^3', '~4.0.0', '^4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true
          run-install: true
      - name: Use Nuxt ${{ matrix.nuxt }} in the matrix fixture
        working-directory: packages/layerscope/test/fixtures/matrix
        env:
          NUXT_RANGE: ${{ matrix.nuxt }}
        run: npm pkg set "dependencies.nuxt=$NUXT_RANGE"
      - run: vp install --no-frozen-lockfile
      - run: vp test
