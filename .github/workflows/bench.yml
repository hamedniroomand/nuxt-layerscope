name: Benchmark

# Times layerscope on a generated project and writes the table to the job summary. It never fails
# on a slow run: shared runners are too noisy for a limit. Run it by hand to compare a change.

on:
  workflow_dispatch:
    inputs:
      files:
        description: Source files in the generated project
        default: '500'
  push:
    branches: [main]
    paths:
      - packages/layerscope/src/**
      - packages/layerscope/bench/**
      - .github/workflows/bench.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: '24'
          cache: true
          run-install: true
      - run: vp run nuxt-layerscope#build
      - name: Run the benchmark
        # `shell: bash` sets pipefail, so a failing benchmark fails the step instead of `tee`.
        shell: bash
        env:
          FILES: ${{ inputs.files || '500' }}
        run: |
          pnpm --filter nuxt-layerscope bench --files "$FILES" --runs 3 --json "$RUNNER_TEMP/bench.json" | tee "$RUNNER_TEMP/bench.md"
          { echo "## Benchmark, $FILES source files"; echo; cat "$RUNNER_TEMP/bench.md"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark
          path: ${{ runner.temp }}/bench.json
          retention-days: 30
