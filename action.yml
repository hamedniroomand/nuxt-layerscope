name: nuxt-layerscope
description: Check Nuxt layer boundaries, including auto-imports, and annotate the pull request.
author: Hamed Niroomand
branding:
  icon: layers
  color: green

inputs:
  root:
    description: Nuxt project root, relative to the repository.
    default: .
  config:
    description: Path to layerscope.config.ts, relative to the root. Defaults to the one in the root.
    default: ''
  prepare:
    description: Run "nuxi prepare" before checking. Needs the project's dependencies installed.
    default: 'false'
  baseline:
    description: Baseline file, relative to the root. It must be in the git repository. Defaults to the baseline key of the config, else layerscope-baseline.json.
    default: ''
  strict-baseline:
    description: Fail the check when the baseline has fixed entries (entries that no finding matches). Then run "layerscope check --update-baseline" and commit the file. The version of `nuxt-layerscope` that the action runs must be 0.10.0 or later.
    default: 'false'
  fail-on-growth:
    description: 'Fail the job when the drift report shows errors that the baseline at the base does not have, also when the change adds them to the baseline. Turn it on after the baseline file is on the base branch. Also fail when the report cannot be made, except for an event with no base commit. A pull request with the label `layerscope: accept growth` passes on growth. The version of `nuxt-layerscope` that the action runs must be 0.10.0 or later.'
    default: 'false'
  comment:
    description: Post the drift report as a pull request comment, one for each root. Needs `pull-requests` write permission. Skipped on a `pull_request` event from a fork.
    default: 'false'
  version:
    description: nuxt-layerscope version to run when the project does not install it. The default is the version of this action release.
    default: 0.10.0

outputs:
  comment:
    description: What the action did with the pull request comment, `created`, `updated`, `skipped` or `failed`.
    value: ${{ steps.post.outputs.comment }}

runs:
  using: composite
  steps:
    - name: Check layer boundaries
      shell: bash
      env:
        INPUT_ROOT: ${{ inputs.root }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_PREPARE: ${{ inputs.prepare == 'true' }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_STRICT_BASELINE: ${{ inputs.strict-baseline == 'true' }}
        INPUT_VERSION: ${{ inputs.version }}
      run: '"$GITHUB_ACTION_PATH/scripts/check.sh"'

    # The CLI runs in this step. The action does not give it the token.
    - name: Build the drift report
      id: report
      if: ${{ always() }}
      shell: bash
      continue-on-error: true
      env:
        INPUT_ROOT: ${{ inputs.root }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_PREPARE: ${{ inputs.prepare == 'true' }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_FAIL_ON_GROWTH: ${{ inputs.fail-on-growth == 'true' }}
        INPUT_VERSION: ${{ inputs.version }}
        BASE_SHA: ${{ github.event.before || github.event.merge_group.base_sha }}
      run: '"$GITHUB_ACTION_PATH/scripts/drift.sh"'

    # This step runs gh and node, never the CLI.
    - name: Post the drift comment
      id: post
      if: ${{ always() }}
      shell: bash
      continue-on-error: true
      env:
        INPUT_ROOT: ${{ inputs.root }}
        INPUT_COMMENT: ${{ inputs.comment == 'true' }}
        REPORT_DIR: ${{ steps.report.outputs.dir }}
        GH_TOKEN: ${{ github.token }}
        GH_ENTERPRISE_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      run: '"$GITHUB_ACTION_PATH/scripts/comment.sh"'

    # The last step, so the comment is posted first. It runs neither gh nor the CLI.
    - name: Fail on drift growth or a missing report
      if: ${{ always() && inputs.fail-on-growth == 'true' }}
      shell: bash
      env:
        REPORT_DIR: ${{ steps.report.outputs.dir }}
        ACCEPT_GROWTH: "${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && contains(github.event.pull_request.labels.*.name, 'layerscope: accept growth') }}"
      run: '"$GITHUB_ACTION_PATH/scripts/growth.sh"'
