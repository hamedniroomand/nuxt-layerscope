name: nuxt-layerscope
description: Check Nuxt layer boundaries, including auto-imports, and annotate the pull request.
author: Hamed Niroomand
branding:
  icon: layers
  color: green

inputs:
  root:
    description: Nuxt project root, relative to the repository.
    default: .
  config:
    description: Path to layerscope.config.ts. Defaults to the one in the root.
    default: ''
  prepare:
    description: Run "nuxi prepare" before checking. Needs the project's dependencies installed.
    default: 'false'
  baseline:
    description: Baseline file, relative to the root.
    default: layerscope-baseline.json
  comment:
    description: Post the drift report as a pull request comment, one for each root. Needs `pull-requests` write permission. Skipped on a `pull_request` event from a fork.
    default: 'false'
  version:
    description: nuxt-layerscope version to run when the project does not install it.
    default: latest

outputs:
  comment:
    description: What the action did with the pull request comment, `created`, `updated`, `skipped` or `failed`.
    value: ${{ steps.drift.outputs.comment }}

runs:
  using: composite
  steps:
    - name: Check layer boundaries
      shell: bash
      env:
        INPUT_ROOT: ${{ inputs.root }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_PREPARE: ${{ inputs.prepare }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        args=(check "$INPUT_ROOT" --format github --baseline "$INPUT_BASELINE")
        if [ -n "$INPUT_CONFIG" ]; then args+=(--config "$INPUT_CONFIG"); fi
        if [ "$INPUT_PREPARE" = "true" ]; then args+=(--prepare); fi
        "$GITHUB_ACTION_PATH/scripts/layerscope.sh" "${args[@]}"

    - name: Report drift
      id: drift
      if: ${{ always() }}
      shell: bash
      continue-on-error: true
      env:
        INPUT_ROOT: ${{ inputs.root }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_PREPARE: ${{ inputs.prepare }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        BASE_SHA: ${{ github.event.before || github.event.merge_group.base_sha }}
      run: '"$GITHUB_ACTION_PATH/scripts/drift.sh"'
